<ion-content [fullscreen]="true" class="login-content">
  <div class="background-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="login-container">
    <div class="login-wrapper">
      
      <div class="brand-section ion-text-center">
        <div class="logo-wrapper">
          <ion-icon name="person-add-outline" class="brand-icon"></ion-icon>
        </div>
        <h1 class="brand-title">Crear Cuenta</h1>
        <p class="brand-subtitle">Únete a la comunidad de Huellitas</p>
      </div>

      <div class="form-section">
        <ion-card class="login-card">
          <ion-card-content>
            
            <div class="input-group">
              <ion-item lines="none" class="custom-input">
                <ion-icon name="person-outline" slot="start"></ion-icon>
                <ion-input type="text" placeholder="Nombre completo"></ion-input>
              </ion-item>
            </div>

            <div class="input-group ion-margin-top">
              <ion-item lines="none" class="custom-input">
                <ion-icon name="mail-outline" slot="start"></ion-icon>
                <ion-input type="email" placeholder="Correo electrónico"></ion-input>
              </ion-item>
            </div>

            <div class="input-group ion-margin-top">
              <ion-item lines="none" class="custom-input">
                <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
                <ion-input type="password" placeholder="Contraseña"></ion-input>
              </ion-item>
            </div>

            <div class="input-group ion-margin-top">
              <ion-item lines="none" class="custom-input">
                <ion-icon name="shield-checkmark-outline" slot="start"></ion-icon>
                <ion-input type="password" placeholder="Confirmar contraseña"></ion-input>
              </ion-item>
            </div>

            <ion-button expand="block" class="login-btn ion-margin-top" (click)="registrarUsuario()">
              Registrarse
              <ion-icon name="checkmark-circle-outline" slot="end"></ion-icon>
            </ion-button>

            <div class="register-link ion-text-center ion-margin-top">
              <p>¿Ya tienes una cuenta? <a href="#" (click)="irAlLogin($event)">Inicia sesión</a></p>
            </div>

          </ion-card-content>
        </ion-card>
      </div>

    </div>
  </div>
</ion-content>
